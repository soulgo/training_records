name: Sync (Dev)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Dev sync channel to run
        required: true
        type: choice
        default: telegram
        options:
          - telegram
          - feishu
  repository_dispatch:
    types:
      - telegram_update_dev
      - feishu_update_dev

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && format('sync-dev-{0}', github.run_id) || 'sync-dev' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: 'true'
      TRAINING_DB_URL: ${{ secrets.DEV_TRAINING_DB_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.DEV_TRAINING_DB_APP_NAME }}
      TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Determine sync channel
        id: channel
        run: |
          EVENT_TYPE="${{ github.event.action }}"
          INPUT_CHANNEL="${{ github.event.inputs.channel || 'telegram' }}"
          if [ "$EVENT_TYPE" = "feishu_update_dev" ] || [ "$INPUT_CHANNEL" = "feishu" ]; then
            echo "channel=feishu" >> "$GITHUB_OUTPUT"
            echo "sync_command=sync:feishu" >> "$GITHUB_OUTPUT"
            echo "result_path=${RUNNER_TEMP}/feishu-sync-result.json" >> "$GITHUB_OUTPUT"
            echo "commit_message=chore(dev): sync Feishu updates" >> "$GITHUB_OUTPUT"
          else
            echo "channel=telegram" >> "$GITHUB_OUTPUT"
            echo "sync_command=sync:telegram" >> "$GITHUB_OUTPUT"
            echo "result_path=${RUNNER_TEMP}/telegram-sync-result.json" >> "$GITHUB_OUTPUT"
            echo "commit_message=chore(dev): sync Telegram updates" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync updates
        id: sync
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai-compatible' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
          AI_CONCURRENCY: ${{ vars.AI_CONCURRENCY }}
          TELEGRAM_RECOGNITION_IMAGE_INPUT_MODE: inline
          TELEGRAM_RECOGNITION_MODEL: ${{ vars.TELEGRAM_RECOGNITION_MODEL }}
          TELEGRAM_RECOGNITION_FALLBACK_API_KEY: ${{ secrets.TELEGRAM_RECOGNITION_FALLBACK_API_KEY }}
          TELEGRAM_RECOGNITION_FALLBACK_BASE_URL: ${{ vars.TELEGRAM_RECOGNITION_FALLBACK_BASE_URL }}
          TELEGRAM_RECOGNITION_FALLBACK_MODEL: ${{ vars.TELEGRAM_RECOGNITION_FALLBACK_MODEL }}
          TELEGRAM_RECOGNITION_FALLBACK_TIMEOUT_MS: ${{ vars.TELEGRAM_RECOGNITION_FALLBACK_TIMEOUT_MS }}
          TELEGRAM_RECOGNITION_CACHE_ENABLED: ${{ vars.TELEGRAM_RECOGNITION_CACHE_ENABLED }}
          TRAINING_ANALYSIS_GOAL: ${{ vars.TRAINING_ANALYSIS_GOAL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_POLL_LIMIT: ${{ vars.TELEGRAM_POLL_LIMIT }}
          TELEGRAM_SYNC_TRANSPORT: webhook
          TELEGRAM_SYNC_NOTIFY_STAGE: after_action
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
          FEISHU_APP_ID: ${{ secrets.DEV_FEISHU_APP_ID || secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.DEV_FEISHU_APP_SECRET || secrets.FEISHU_APP_SECRET }}
          FEISHU_ALLOWED_CHAT_IDS: ${{ vars.DEV_FEISHU_ALLOWED_CHAT_IDS || vars.FEISHU_ALLOWED_CHAT_IDS }}
          FEISHU_RECOGNITION_IMAGE_INPUT_MODE: inline
          FEISHU_SYNC_TRANSPORT: webhook
          FEISHU_SYNC_NOTIFY_STAGE: after_action
          FEISHU_SYNC_RESULT_PATH: ${{ runner.temp }}/feishu-sync-result.json
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          if [ "$CHANNEL" = "feishu" ] && [ -z "${TRAINING_DB_APP_NAME:-}" ]; then
            export TRAINING_DB_APP_NAME=sync-dev-feishu
          fi
          npm run ${{ steps.channel.outputs.sync_command }}

      - name: Detect changes
        id: detect
        env:
          SYNC_RESULT_PATH: ${{ steps.channel.outputs.result_path }}
        run: |
          if [ -z "$(git status --porcelain -- 训练记录.md source/_posts source/images)" ]; then
            echo "repo_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "repo_changed=true" >> "$GITHUB_OUTPUT"
          fi
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const resultPath = process.env.SYNC_RESULT_PATH;
          let readyStoredContentBatches = 0;
          try {
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            const batches = result.batchResults ?? result.batches ?? [];
            readyStoredContentBatches = batches.filter((batch) => {
              const kind = batch.kind ?? 'image';
              return ['image', 'thought', 'thought_edit', 'thought_delete', 'thought_move'].includes(kind) &&
                batch.status === 'ready' &&
                batch.persistenceStatus === 'stored';
            }).length;
          } catch {}
          console.log(`readyStoredContentBatches=${readyStoredContentBatches}`);
          if (readyStoredContentBatches > 0) {
            console.log('db_content_changed=true');
          } else {
            console.log('db_content_changed=false');
          }
          NODE

      - name: Commit sync results
        id: commit
        if: steps.detect.outputs.repo_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 训练记录.md source/_posts source/images
          git commit -m "${{ steps.channel.outputs.commit_message }}"

      - name: Push changes
        id: push
        if: steps.detect.outputs.repo_changed == 'true'
        run: git push origin HEAD:dev

      - name: Write Telegram sync summary
        if: always() && github.event_name == 'repository_dispatch' && steps.channel.outputs.channel == 'telegram'
        env:
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          (async () => {
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const resultPath = process.env.TELEGRAM_SYNC_RESULT_PATH;
          let result = {};
          try {
            result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          } catch {
            console.log('## Telegram sync result');
            console.log('');
            console.log('Result file was not written.');
            process.exit(0);
          }
          const { buildTelegramSyncReport } = await import(pathToFileURL(path.resolve('tools/telegram-sync.mjs')).href);
          const report = result.batchResults ? buildTelegramSyncReport(result) : result;
          const batches = report.batches ?? result.batches ?? result.batchResults ?? [];
          const timings = report.timingsMs ?? result.timingsMs ?? {};
          console.log('## Telegram sync result');
          console.log('');
          if (Object.keys(timings).length > 0) {
            console.log('| stage | ms |');
            console.log('| --- | ---: |');
            for (const [stage, ms] of Object.entries(timings)) {
              console.log(`| ${stage} | ${ms} |`);
            }
            console.log('');
          }
          console.log('| batchId | taskStatus | persistenceStatus | archivedDate | images | pending | failureDisposition | failed messageIds |');
          console.log('| --- | --- | --- | --- | --- | --- | --- | --- |');
          for (const batch of batches) {
            const failedIds = (batch.recognitionErrors ?? [])
              .map((item) => item.messageId ?? item.message_id)
              .filter((value) => value !== null && value !== undefined)
              .join(', ');
            const images = `${batch.sourceImageCount ?? 0}/${batch.recognizedImageCount ?? 0}/${batch.failedImageCount ?? 0}`;
            const failureDisposition = batch.failureDisposition ??
              (batch.recognitionPendingStatus === 'queued' || batch.persistenceStatus === 'pending_replay' ? 'auto_retry' :
                (batch.status === 'skipped' || batch.status === 'ignored' ? 'skip' : 'none'));
            console.log(`| ${batch.batchId ?? ''} | ${batch.taskStatus ?? batch.status ?? ''} | ${batch.persistenceStatus ?? ''} | ${batch.archivedDate ?? ''} | ${images} | ${batch.recognitionPendingStatus ?? ''} | ${failureDisposition} | ${failedIds} |`);
          }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Write Feishu sync summary
        if: always() && github.event_name == 'repository_dispatch' && steps.channel.outputs.channel == 'feishu'
        env:
          FEISHU_SYNC_RESULT_PATH: ${{ runner.temp }}/feishu-sync-result.json
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          (async () => {
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const resultPath = process.env.FEISHU_SYNC_RESULT_PATH;
          let result = {};
          try {
            result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          } catch {
            console.log('## Feishu sync result');
            console.log('');
            console.log('Result file was not written.');
            process.exit(0);
          }
          const { buildFeishuSyncReport } = await import(pathToFileURL(path.resolve('tools/feishu-sync.mjs')).href);
          const report = result.batchResults ? buildFeishuSyncReport(result) : result;
          const batches = report.batches ?? result.batches ?? result.batchResults ?? [];
          console.log('## Feishu sync result');
          console.log('');
          console.log('| batchId | sourceId | chatIds | taskStatus | persistenceStatus | archivedDate | images | pending | failureDisposition | failed messageIds |');
          console.log('| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |');
          for (const batch of batches) {
            const failedIds = (batch.recognitionErrors ?? [])
              .map((item) => item.sourceMessageId ?? item.messageId ?? item.message_id)
              .filter((value) => value !== null && value !== undefined)
              .join(', ');
            const chatIds = (batch.chatIds ?? [])
              .filter((value) => value !== null && value !== undefined && value !== '')
              .join(', ');
            const images = `${batch.sourceImageCount ?? 0}/${batch.recognizedImageCount ?? 0}/${batch.failedImageCount ?? 0}`;
            const failureDisposition = batch.failureDisposition ??
              (batch.recognitionPendingStatus === 'queued' || batch.persistenceStatus === 'pending_replay' ? 'auto_retry' :
                (batch.status === 'skipped' || batch.status === 'ignored' ? 'skip' : 'none'));
            console.log(`| ${batch.batchId ?? ''} | ${batch.sourceId ?? ''} | ${chatIds} | ${batch.taskStatus ?? batch.status ?? ''} | ${batch.persistenceStatus ?? ''} | ${batch.archivedDate ?? ''} | ${images} | ${batch.recognitionPendingStatus ?? ''} | ${failureDisposition} | ${failedIds} |`);
          }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Notify Telegram sync result
        if: success() && github.event_name == 'repository_dispatch' && steps.channel.outputs.channel == 'telegram'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SYNC_NOTIFY: true
          TELEGRAM_SYNC_NOTIFY_STAGE: after_action
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
        run: node tools/telegram-sync-notify.mjs

      - name: Notify Feishu sync result
        if: success() && github.event_name == 'repository_dispatch' && steps.channel.outputs.channel == 'feishu'
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.DEV_FEISHU_APP_ID || secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.DEV_FEISHU_APP_SECRET || secrets.FEISHU_APP_SECRET }}
          FEISHU_SYNC_NOTIFY: true
          FEISHU_SYNC_NOTIFY_STAGE: after_action
          FEISHU_SYNC_RESULT_PATH: ${{ runner.temp }}/feishu-sync-result.json
        run: node tools/feishu-sync-notify.mjs

      - name: Trigger async dev site deploy
        if: success() && github.event_name == 'repository_dispatch' && (steps.detect.outputs.repo_changed == 'true' || steps.detect.outputs.db_content_changed == 'true')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare-pages-dev.yml/dispatches" \
            -d '{"ref":"dev","inputs":{"strict_database_snapshot":"true"}}'

      - name: Notify Telegram sync failure
        if: failure() && github.event_name == 'repository_dispatch' && steps.channel.outputs.channel == 'telegram'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_TELEGRAM_BOT_TOKEN }}
          STEP_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          STEP_SYNC_OUTCOME: ${{ steps.sync.outcome }}
          STEP_DETECT_OUTCOME: ${{ steps.detect.outcome }}
          STEP_COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          STEP_PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: node tools/telegram-action-monitor.mjs

      - name: Notify Feishu sync failure
        if: failure() && github.event_name == 'repository_dispatch' && steps.channel.outputs.channel == 'feishu'
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.DEV_FEISHU_APP_ID || secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.DEV_FEISHU_APP_SECRET || secrets.FEISHU_APP_SECRET }}
          STEP_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          STEP_SYNC_OUTCOME: ${{ steps.sync.outcome }}
          STEP_DETECT_OUTCOME: ${{ steps.detect.outcome }}
          STEP_COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          STEP_PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: node tools/feishu-action-monitor.mjs
