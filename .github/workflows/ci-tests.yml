name: CI Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'
  push:
    branches:
      - main
      - dev
    paths:
      - 训练记录.md
      - _config.yml
      - source/**
      - src/**
      - test/**
      - themes/**
      - tools/**
      - cloudflare/**
      - docs/**
      - prompts/**
      - sql/**
      - .github/actions/site-build/action.yml
      - .github/workflows/deploy-pages.yml
      - .github/workflows/telegram-sync.yml
      - .github/workflows/telegram-sync-dev.yml
      - .github/workflows/feishu-sync.yml
      - .github/workflows/feishu-sync-dev.yml
      - .github/workflows/deploy-cloudflare-worker.yml
      - .github/workflows/deploy-cloudflare-worker-dev.yml
      - .github/workflows/deploy-cloudflare-feishu-worker.yml
      - .github/workflows/deploy-cloudflare-pages-dev.yml
      - .github/workflows/refresh-telegram-webhook.yml
      - .github/workflows/markdown-backup.yml
      - .github/workflows/ci-tests.yml
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - 训练记录.md
      - _config.yml
      - source/**
      - src/**
      - test/**
      - themes/**
      - tools/**
      - cloudflare/**
      - docs/**
      - prompts/**
      - sql/**
      - .github/actions/site-build/action.yml
      - .github/workflows/deploy-pages.yml
      - .github/workflows/telegram-sync.yml
      - .github/workflows/telegram-sync-dev.yml
      - .github/workflows/feishu-sync.yml
      - .github/workflows/feishu-sync-dev.yml
      - .github/workflows/deploy-cloudflare-worker.yml
      - .github/workflows/deploy-cloudflare-worker-dev.yml
      - .github/workflows/deploy-cloudflare-feishu-worker.yml
      - .github/workflows/deploy-cloudflare-pages-dev.yml
      - .github/workflows/refresh-telegram-webhook.yml
      - .github/workflows/markdown-backup.yml
      - .github/workflows/ci-tests.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check protected derived data changes
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: npm run check:derived-data-merge -- --base origin/main

      - name: Run tests
        run: npm run test:fast

  full-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full tests
        run: npm test
