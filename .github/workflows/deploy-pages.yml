name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 训练记录.md
      - _config.yml
      - source/**
      - themes/**
      - tools/**
      - .github/workflows/deploy-pages.yml
      - .github/workflows/telegram-sync.yml
      - package.json
      - package-lock.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_reusable-build.yml
    with:
      run_backfill: true
      run_tests: true
      deploy: true
      checkout_ref: main
    secrets: inherit
