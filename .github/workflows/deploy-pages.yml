name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      strict_database_snapshot:
        description: Fail the build instead of falling back to Markdown when the database snapshot is unavailable.
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths:
      - 训练记录.md
      - _config.yml
      - source/**
      - src/**
      - themes/**
      - tools/**
      - prompts/**
      - .github/actions/site-build/action.yml
      - .github/workflows/deploy-pages.yml
      - .github/workflows/sync.yml
      - package.json
      - package-lock.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
      TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
      TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
      TRAINING_SNAPSHOT_STRICT_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_database_snapshot || 'false' }}
      TRAINING_BUILD_ARCHIVE_WRITE: false
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and deploy site
        uses: ./.github/actions/site-build
        with:
          run_backfill: 'true'
          sync_db_mode: 'auto'
          run_tests: 'true'
          deploy: 'true'

      - name: Purge Cloudflare cache
        if: ${{ success() && env.CLOUDFLARE_ZONE_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          response_file="$(mktemp)"
          http_status="000"
          if ! http_status="$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache")"; then
            echo "::warning title=Cloudflare cache purge failed::curl could not call the purge API. Check CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN."
            cat "${response_file}" || true
            exit 0
          fi

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "::warning title=Cloudflare cache purge failed::Cloudflare returned HTTP ${http_status}. Check that CLOUDFLARE_API_TOKEN has Zone -> Cache Purge -> Purge permission."
            cat "${response_file}" || true
            exit 0
          fi

          if ! grep -q '"success":true' "${response_file}"; then
            echo "::warning title=Cloudflare cache purge failed::Cloudflare did not report success. Check the purge API response."
            cat "${response_file}" || true
            exit 0
          fi

          cat "${response_file}"

      - name: Report skipped Cloudflare cache purge
        if: ${{ success() && (env.CLOUDFLARE_ZONE_ID == '' || env.CLOUDFLARE_API_TOKEN == '') }}
        run: |
          echo "::warning title=Cloudflare cache purge skipped::CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN is not configured; deployed pages may stay behind Cloudflare cache until TTL expiry."
