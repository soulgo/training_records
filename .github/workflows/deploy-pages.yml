name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      strict_database_snapshot:
        description: Fail the build instead of falling back to Markdown when the database snapshot is unavailable.
        required: false
        default: 'true'
      sync_db_mode:
        description: Safe database sync strategy before building.
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - always
          - never
      run_tests:
        description: Whether to run the fast test suite before building.
        required: false
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      target_thought_id:
        description: Optional thought id to verify on the deployed module page.
        required: false
        default: ''
      target_thought_module:
        description: Optional thought module key expected after a DB-only thought change.
        required: false
        default: ''
      target_thought_path:
        description: Optional deployed module page path to verify, such as /body-feedback/.
        required: false
        default: ''
      target_thought_expectation:
        description: Whether the target thought should be present or absent on the deployed module page.
        required: false
        default: 'present'
  push:
    branches:
      - main
    paths:
      - 训练记录.md
      - _config.yml
      - source/**
      - src/**
      - themes/**
      - tools/**
      - prompts/**
      - .github/actions/site-build/action.yml
      - .github/workflows/deploy-pages.yml
      - .github/workflows/sync.yml
      - package.json
      - package-lock.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
      TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
      TRAINING_DB_READONLY_URL: ${{ secrets.TRAINING_DB_READONLY_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
      TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
      TRAINING_SNAPSHOT_STRICT_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_database_snapshot || 'true' }}
      TRAINING_BUILD_ARCHIVE_WRITE: false
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build and deploy site
        uses: ./.github/actions/site-build
        with:
          run_backfill: 'true'
          sync_db_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_db_mode || 'auto' }}
          run_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests || 'true' }}
          deploy: 'true'

      - name: Purge Cloudflare cache
        if: ${{ success() && env.CLOUDFLARE_ZONE_ID != '' && (env.CLOUDFLARE_API_TOKEN != '' || env.CLOUDFLARE_PAGES_API_TOKEN != '') }}
        run: |
          token_names=()
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_names+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -n "${CLOUDFLARE_PAGES_API_TOKEN:-}" ] && [ "${CLOUDFLARE_PAGES_API_TOKEN}" != "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_names+=("CLOUDFLARE_PAGES_API_TOKEN")
          fi

          last_response_file=""
          last_http_status="000"
          for token_name in "${token_names[@]}"; do
            response_file="$(mktemp)"
            token_value="${!token_name}"
            http_status="000"
            if ! http_status="$(curl -sS -o "${response_file}" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${token_value}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache")"; then
              echo "::notice title=Cloudflare cache purge retry::${token_name} could not call the purge API; trying the next configured token if available."
              last_response_file="${response_file}"
              last_http_status="${http_status}"
              continue
            fi

            if [ "${http_status}" -ge 200 ] && [ "${http_status}" -lt 300 ] && grep -q '"success":true' "${response_file}"; then
              echo "Cloudflare cache purged with ${token_name}."
              cat "${response_file}"
              exit 0
            fi

            echo "::notice title=Cloudflare cache purge retry::${token_name} returned HTTP ${http_status}; trying the next configured token if available."
            last_response_file="${response_file}"
            last_http_status="${http_status}"
          done

          echo "::error title=Cloudflare cache purge failed::Cloudflare purge failed with all configured tokens; last HTTP status ${last_http_status}. Check that the token has Zone -> Cache Purge -> Purge permission."
          if [ -n "${last_response_file}" ]; then
            cat "${last_response_file}" || true
          fi
          exit 1

      - name: Report skipped Cloudflare cache purge
        if: ${{ success() && (env.CLOUDFLARE_ZONE_ID == '' || (env.CLOUDFLARE_API_TOKEN == '' && env.CLOUDFLARE_PAGES_API_TOKEN == '')) }}
        run: |
          echo "::error title=Cloudflare cache purge skipped::CLOUDFLARE_ZONE_ID and at least one Cloudflare API token are required; deployed pages may stay behind Cloudflare cache until TTL expiry."
          exit 1

      - name: Verify deployed thought module page
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.target_thought_id != '' && inputs.target_thought_path != '' }}
        env:
          TARGET_THOUGHT_ID: ${{ inputs.target_thought_id }}
          TARGET_THOUGHT_MODULE: ${{ inputs.target_thought_module }}
          TARGET_THOUGHT_PATH: ${{ inputs.target_thought_path }}
          TARGET_THOUGHT_EXPECTATION: ${{ inputs.target_thought_expectation }}
          CLOUDFLARE_PAGES_BASE_URL: ${{ vars.CLOUDFLARE_PAGES_BASE_URL }}
        run: |
          base_url="${CLOUDFLARE_PAGES_BASE_URL:-https://soulgo.chat}"
          base_url="${base_url%/}"
          normalized_path="/${TARGET_THOUGHT_PATH#/}"
          normalized_path="${normalized_path%/}/"
          target_url="${base_url}${normalized_path}"
          generated_page_file="public${normalized_path}index.html"
          page_file="$(mktemp)"
          module_paths=("/thoughts/" "/misc/" "/body-feedback/")
          expected="${TARGET_THOUGHT_EXPECTATION:-present}"
          if [ "$expected" != "absent" ]; then
            expected="present"
          fi
          verification_attempts=12
          verification_delay_seconds=10

          if [ ! -f "$generated_page_file" ]; then
            echo "::error title=Generated thought page verification failed::Generated module page ${generated_page_file} is missing."
            {
              echo "## Thought page verification"
              echo ""
              echo "- Generated result: missing page"
              echo "- Expected: ${expected}"
              echo "- Thought id: ${TARGET_THOUGHT_ID}"
              echo "- Module: ${TARGET_THOUGHT_MODULE:-unknown}"
              echo "- Path: ${generated_page_file}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          generated_found=false
          if grep -F "data-thought-id=\"${TARGET_THOUGHT_ID}\"" "$generated_page_file" >/dev/null; then
            generated_found=true
          fi

          if ! { [ "$expected" = "present" ] && [ "$generated_found" = "true" ]; } &&
             ! { [ "$expected" = "absent" ] && [ "$generated_found" = "false" ]; }; then
            echo "::error title=Generated thought page verification failed::Generated ${generated_page_file} expected ${expected} for thought #${TARGET_THOUGHT_ID}, found=${generated_found}."
            {
              echo "## Thought page verification"
              echo ""
              echo "- Generated result: ${generated_found}"
              echo "- Expected: ${expected}"
              echo "- Thought id: ${TARGET_THOUGHT_ID}"
              echo "- Module: ${TARGET_THOUGHT_MODULE:-unknown}"
              echo "- Path: ${generated_page_file}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          for module_path in "${module_paths[@]}"; do
            module_file="public${module_path}index.html"
            if [ ! -f "$module_file" ]; then
              echo "::error title=Generated thought page verification failed::Generated module page ${module_file} is missing."
              exit 1
            fi

            module_found=false
            if grep -F "data-thought-id=\"${TARGET_THOUGHT_ID}\"" "$module_file" >/dev/null; then
              module_found=true
            fi

            if [ "$expected" = "present" ] && [ "$module_path" != "$normalized_path" ] && [ "$module_found" = "true" ]; then
              echo "::error title=Generated thought page verification failed::Unexpected thought #${TARGET_THOUGHT_ID} in generated ${module_file}; expected it only in ${generated_page_file}."
              exit 1
            fi

            if [ "$expected" = "absent" ] && [ "$module_found" = "true" ]; then
              echo "::error title=Generated thought page verification failed::Unexpected thought #${TARGET_THOUGHT_ID} in generated ${module_file}; expected it absent from all thought module pages."
              exit 1
            fi
          done

          found=false
          fetch_succeeded=false
          for attempt in $(seq 1 "$verification_attempts"); do
            rm -f "$page_file"
            page_file="$(mktemp)"
            if curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -H "Cache-Control: no-cache" "$target_url" -o "$page_file"; then
              fetch_succeeded=true
              if grep -F "data-thought-id=\"${TARGET_THOUGHT_ID}\"" "$page_file" >/dev/null; then
                found=true
                break
              fi
            fi

            if [ "$expected" = "absent" ]; then
              break
            fi

            if [ "$attempt" -lt "$verification_attempts" ]; then
              echo "Thought #${TARGET_THOUGHT_ID} not found on target URL (attempt ${attempt}/${verification_attempts}); waiting ${verification_delay_seconds}s for Pages propagation..."
              sleep "$verification_delay_seconds"
            fi
          done

          if [ "$fetch_succeeded" = "false" ]; then
            echo "::warning title=Live thought page verification stale::Generated artifact is correct, but ${target_url} could not be fetched after deploy."
          elif { [ "$expected" = "present" ] && [ "$found" = "true" ]; } ||
               { [ "$expected" = "absent" ] && [ "$found" = "false" ]; }; then
            for module_path in "${module_paths[@]}"; do
              module_url="${base_url}${module_path}"
              module_file="$(mktemp)"
              if ! curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -H "Cache-Control: no-cache" "$module_url" -o "$module_file"; then
                echo "::warning title=Live thought page verification stale::Generated artifact is correct, but ${module_url} could not be fetched after deploy."
                continue
              fi

              module_found=false
              if grep -F "data-thought-id=\"${TARGET_THOUGHT_ID}\"" "$module_file" >/dev/null; then
                module_found=true
              fi

              if [ "$expected" = "present" ] && [ "$module_path" != "$normalized_path" ] && [ "$module_found" = "true" ]; then
                echo "::warning title=Live thought page verification stale::Generated artifact is correct, but live ${module_url} still contains thought #${TARGET_THOUGHT_ID}; expected it only on ${target_url}."
              fi

              if [ "$expected" = "absent" ] && [ "$module_found" = "true" ]; then
                echo "::warning title=Live thought page verification stale::Generated artifact is correct, but live ${module_url} still contains thought #${TARGET_THOUGHT_ID}; expected it absent from all thought module pages."
              fi
            done
          else
            echo "::warning title=Live thought page verification stale::Generated artifact is correct, but live ${target_url} expected ${expected} for thought #${TARGET_THOUGHT_ID}, found=${found}."
          fi

          {
            echo "## Thought page verification"
            echo ""
            echo "- Generated result: ${generated_found}"
            echo "- Live result: ${found}"
            echo "- Live fetch succeeded: ${fetch_succeeded}"
            echo "- Expected: ${expected}"
            echo "- Thought id: ${TARGET_THOUGHT_ID}"
            echo "- Module: ${TARGET_THOUGHT_MODULE:-unknown}"
            echo "- Generated path: ${generated_page_file}"
            echo "- URL: ${target_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report Action Status
        if: always()
        continue-on-error: true
        env:
          GITHUB_ACTION_MONITOR_REPORT_URL: ${{ vars.GITHUB_ACTION_MONITOR_REPORT_URL }}
          GITHUB_ACTION_MONITOR_REPORT_URL_DEV: ${{ vars.GITHUB_ACTION_MONITOR_REPORT_URL_DEV }}
          GITHUB_ACTION_MONITOR_REPORT_URL_MAIN: ${{ vars.GITHUB_ACTION_MONITOR_REPORT_URL_MAIN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTION_MONITOR_JOB_STATUS: ${{ job.status }}
          TRAINING_DB_URL: ${{ github.ref_name == 'dev' && secrets.DEV_TRAINING_DB_URL || github.ref_name == 'main' && secrets.TRAINING_DB_URL || '' }}
          TRAINING_DB_APP_NAME: ${{ github.ref_name == 'dev' && vars.DEV_TRAINING_DB_APP_NAME || github.ref_name == 'main' && vars.TRAINING_DB_APP_NAME || '' }}
        run: |
          report_url="${GITHUB_ACTION_MONITOR_REPORT_URL:-}"
          if [ "${GITHUB_REF_NAME}" = "dev" ] && [ -n "${GITHUB_ACTION_MONITOR_REPORT_URL_DEV:-}" ]; then
            report_url="${GITHUB_ACTION_MONITOR_REPORT_URL_DEV}"
          elif [ "${GITHUB_REF_NAME}" = "main" ] && [ -n "${GITHUB_ACTION_MONITOR_REPORT_URL_MAIN:-}" ]; then
            report_url="${GITHUB_ACTION_MONITOR_REPORT_URL_MAIN}"
          elif [ "${GITHUB_REF_NAME}" != "dev" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Branch ${GITHUB_REF_NAME} is not monitored by the Action monitor; skipping."
            exit 0
          fi
          if [ -n "${TRAINING_DB_URL:-}" ]; then
            echo "Using local PostgreSQL Action monitor reporter."
            node tools/report-github-action-status.mjs
            exit 0
          fi
          if [ -z "${report_url:-}" ]; then
            echo "GitHub Action monitor report URL is not configured and branch-scoped PostgreSQL URL is unavailable; skipping."
            exit 0
          fi
          curl -fsS -X POST "${report_url%/}/api/github/actions/report" \
            -H "Content-Type: application/json" \
            -d "{\"run_id\":\"${{ github.run_id }}\"}"
