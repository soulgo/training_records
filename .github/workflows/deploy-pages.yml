name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      strict_database_snapshot:
        description: Fail the build instead of falling back to Markdown when the database snapshot is unavailable.
        required: false
        default: 'true'
      target_thought_id:
        description: Optional thought id to verify on the deployed module page.
        required: false
        default: ''
      target_thought_module:
        description: Optional thought module key expected after a DB-only thought change.
        required: false
        default: ''
      target_thought_path:
        description: Optional deployed module page path to verify, such as /body-feedback/.
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 训练记录.md
      - _config.yml
      - source/**
      - src/**
      - themes/**
      - tools/**
      - prompts/**
      - .github/actions/site-build/action.yml
      - .github/workflows/deploy-pages.yml
      - .github/workflows/sync.yml
      - package.json
      - package-lock.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
      TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
      TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
      TRAINING_SNAPSHOT_STRICT_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_database_snapshot || 'true' }}
      TRAINING_BUILD_ARCHIVE_WRITE: false
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build and deploy site
        uses: ./.github/actions/site-build
        with:
          run_backfill: 'true'
          sync_db_mode: 'auto'
          run_tests: 'true'
          deploy: 'true'

      - name: Purge Cloudflare cache
        if: ${{ success() && env.CLOUDFLARE_ZONE_ID != '' && (env.CLOUDFLARE_API_TOKEN != '' || env.CLOUDFLARE_PAGES_API_TOKEN != '') }}
        run: |
          token_names=()
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_names+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -n "${CLOUDFLARE_PAGES_API_TOKEN:-}" ] && [ "${CLOUDFLARE_PAGES_API_TOKEN}" != "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_names+=("CLOUDFLARE_PAGES_API_TOKEN")
          fi

          last_response_file=""
          last_http_status="000"
          for token_name in "${token_names[@]}"; do
            response_file="$(mktemp)"
            token_value="${!token_name}"
            http_status="000"
            if ! http_status="$(curl -sS -o "${response_file}" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${token_value}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache")"; then
              echo "::notice title=Cloudflare cache purge retry::${token_name} could not call the purge API; trying the next configured token if available."
              last_response_file="${response_file}"
              last_http_status="${http_status}"
              continue
            fi

            if [ "${http_status}" -ge 200 ] && [ "${http_status}" -lt 300 ] && grep -q '"success":true' "${response_file}"; then
              echo "Cloudflare cache purged with ${token_name}."
              cat "${response_file}"
              exit 0
            fi

            echo "::notice title=Cloudflare cache purge retry::${token_name} returned HTTP ${http_status}; trying the next configured token if available."
            last_response_file="${response_file}"
            last_http_status="${http_status}"
          done

          echo "::warning title=Cloudflare cache purge failed::Cloudflare purge failed with all configured tokens; last HTTP status ${last_http_status}. Check that the token has Zone -> Cache Purge -> Purge permission."
          if [ -n "${last_response_file}" ]; then
            cat "${last_response_file}" || true
          fi

      - name: Report skipped Cloudflare cache purge
        if: ${{ success() && (env.CLOUDFLARE_ZONE_ID == '' || (env.CLOUDFLARE_API_TOKEN == '' && env.CLOUDFLARE_PAGES_API_TOKEN == '')) }}
        run: |
          echo "::warning title=Cloudflare cache purge skipped::CLOUDFLARE_ZONE_ID and at least one Cloudflare API token are required; deployed pages may stay behind Cloudflare cache until TTL expiry."

      - name: Verify deployed thought module page
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.target_thought_id != '' && inputs.target_thought_path != '' }}
        env:
          TARGET_THOUGHT_ID: ${{ inputs.target_thought_id }}
          TARGET_THOUGHT_MODULE: ${{ inputs.target_thought_module }}
          TARGET_THOUGHT_PATH: ${{ inputs.target_thought_path }}
        run: |
          base_url="https://soulgo.chat"
          normalized_path="/${TARGET_THOUGHT_PATH#/}"
          normalized_path="${normalized_path%/}/"
          target_url="${base_url}${normalized_path}"
          page_file="$(mktemp)"

          if curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -H "Cache-Control: no-cache" "$target_url" -o "$page_file" &&
             grep -F "#${TARGET_THOUGHT_ID}" "$page_file" >/dev/null; then
            {
              echo "## Thought page verification"
              echo ""
              echo "- Result: found"
              echo "- Thought id: ${TARGET_THOUGHT_ID}"
              echo "- Module: ${TARGET_THOUGHT_MODULE:-unknown}"
              echo "- URL: ${target_url}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning title=Thought page verification failed::Thought #${TARGET_THOUGHT_ID} was not found on ${target_url} after deploy."
          {
            echo "## Thought page verification"
            echo ""
            echo "- Result: not found"
            echo "- Thought id: ${TARGET_THOUGHT_ID}"
            echo "- Module: ${TARGET_THOUGHT_MODULE:-unknown}"
            echo "- URL: ${target_url}"
          } >> "$GITHUB_STEP_SUMMARY"
