name: Parameter Health Audit

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment registry to audit.
        required: false
        type: choice
        default: dev
        options:
          - dev
          - main
  schedule:
    - cron: '20 1 * * *'

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PARAMETER_HEALTH_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run parameter health audit
        env:
          PARAMETER_HEALTH_MONITOR_DB_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && secrets.DEV_TRAINING_DB_URL || (github.event_name == 'workflow_dispatch' && inputs.environment == 'main' || github.ref_name == 'main') && secrets.TRAINING_DB_URL || '' }}
          PARAMETER_HEALTH_MONITOR_DB_APP_NAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && vars.DEV_TRAINING_DB_APP_NAME || (github.event_name == 'workflow_dispatch' && inputs.environment == 'main' || github.ref_name == 'main') && vars.TRAINING_DB_APP_NAME || '' }}
          PARAMETER_HEALTH_DB_PRIMARY_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && secrets.DEV_TRAINING_DB_URL || secrets.TRAINING_DB_URL }}
          PARAMETER_HEALTH_DB_READONLY_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && secrets.DEV_TRAINING_DB_READONLY_URL || secrets.TRAINING_DB_READONLY_URL }}
          PARAMETER_HEALTH_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PARAMETER_HEALTH_AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          PARAMETER_HEALTH_AI_FALLBACK_API_KEY: ${{ secrets.TELEGRAM_RECOGNITION_FALLBACK_API_KEY }}
          PARAMETER_HEALTH_AI_FALLBACK_BASE_URL: ${{ secrets.TELEGRAM_RECOGNITION_FALLBACK_BASE_URL }}
          PARAMETER_HEALTH_TELEGRAM_BOT_TOKEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && secrets.DEV_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          PARAMETER_HEALTH_TELEGRAM_SECRET_TOKEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && secrets.DEV_TELEGRAM_SECRET_TOKEN || secrets.TELEGRAM_SECRET_TOKEN }}
          PARAMETER_HEALTH_FEISHU_APP_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && (secrets.DEV_FEISHU_APP_ID || secrets.FEISHU_APP_ID) || secrets.FEISHU_APP_ID }}
          PARAMETER_HEALTH_FEISHU_APP_SECRET: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && (secrets.DEV_FEISHU_APP_SECRET || secrets.FEISHU_APP_SECRET) || secrets.FEISHU_APP_SECRET }}
          PARAMETER_HEALTH_COS_SECRET_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && secrets.DEV_COS_SECRET_ID || secrets.COS_SECRET_ID }}
          PARAMETER_HEALTH_COS_SECRET_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && secrets.DEV_COS_SECRET_KEY || secrets.COS_SECRET_KEY }}
          PARAMETER_HEALTH_COS_BUCKET: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && secrets.DEV_COS_BUCKET || secrets.COS_BUCKET }}
          PARAMETER_HEALTH_COS_REGION: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' || github.ref_name == 'dev') && vars.DEV_COS_REGION || vars.COS_REGION }}
          PARAMETER_HEALTH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PARAMETER_HEALTH_CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          PARAMETER_HEALTH_FEISHU_ENCRYPT_KEY: ${{ secrets.FEISHU_ENCRYPT_KEY }}
          PARAMETER_HEALTH_FEISHU_VERIFICATION_TOKEN: ${{ secrets.FEISHU_VERIFICATION_TOKEN }}
        run: |
          environment="${PARAMETER_HEALTH_ENVIRONMENT:-}"
          if [ "${environment}" != "dev" ] && [ "${environment}" != "main" ]; then
            echo "Branch ${GITHUB_REF_NAME} is not monitored by parameter health audit; skipping."
            exit 0
          fi

          node tools/check-parameter-health.mjs \
            --environment "${environment}" \
            --registry "config/parameter-health/${environment}.json" \
            --write-monitor \
            --run-id "${GITHUB_RUN_ID}"

          echo "Parameter health summary written to ${GITHUB_STEP_SUMMARY}."

      - name: Trigger dev action monitor page refresh
        if: ${{ success() && env.PARAMETER_HEALTH_ENVIRONMENT == 'dev' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-cloudflare-pages-dev.yml/dispatches" \
            -d '{"ref":"dev","inputs":{"strict_database_snapshot":"true","sync_db_mode":"never","run_tests":"false"}}'

      - name: Trigger main action monitor page refresh
        if: ${{ success() && env.PARAMETER_HEALTH_ENVIRONMENT == 'main' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main","inputs":{"strict_database_snapshot":"true","sync_db_mode":"never","run_tests":"false"}}'

      - name: Report Action Status
        if: always()
        continue-on-error: true
        env:
          GITHUB_ACTION_MONITOR_REPORT_URL: ${{ vars.GITHUB_ACTION_MONITOR_REPORT_URL }}
          GITHUB_ACTION_MONITOR_REPORT_URL_DEV: ${{ vars.GITHUB_ACTION_MONITOR_REPORT_URL_DEV }}
          GITHUB_ACTION_MONITOR_REPORT_URL_MAIN: ${{ vars.GITHUB_ACTION_MONITOR_REPORT_URL_MAIN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTION_MONITOR_JOB_STATUS: ${{ job.status }}
          TRAINING_DB_URL: ${{ github.ref_name == 'dev' && secrets.DEV_TRAINING_DB_URL || github.ref_name == 'main' && secrets.TRAINING_DB_URL || '' }}
          TRAINING_DB_APP_NAME: ${{ github.ref_name == 'dev' && vars.DEV_TRAINING_DB_APP_NAME || github.ref_name == 'main' && vars.TRAINING_DB_APP_NAME || '' }}
        run: |
          report_url="${GITHUB_ACTION_MONITOR_REPORT_URL:-}"
          if [ "${GITHUB_REF_NAME}" = "dev" ] && [ -n "${GITHUB_ACTION_MONITOR_REPORT_URL_DEV:-}" ]; then
            report_url="${GITHUB_ACTION_MONITOR_REPORT_URL_DEV}"
          elif [ "${GITHUB_REF_NAME}" = "main" ] && [ -n "${GITHUB_ACTION_MONITOR_REPORT_URL_MAIN:-}" ]; then
            report_url="${GITHUB_ACTION_MONITOR_REPORT_URL_MAIN}"
          elif [ "${GITHUB_REF_NAME}" != "dev" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Branch ${GITHUB_REF_NAME} is not monitored by the Action monitor; skipping."
            exit 0
          fi
          if [ -n "${TRAINING_DB_URL:-}" ]; then
            echo "Using local PostgreSQL Action monitor reporter."
            node tools/report-github-action-status.mjs
            exit 0
          fi
          if [ -z "${report_url:-}" ]; then
            echo "GitHub Action monitor report URL is not configured and branch-scoped PostgreSQL URL is unavailable; skipping."
            exit 0
          fi
          curl -fsS -X POST "${report_url%/}/api/github/actions/report" \
            -H "Content-Type: application/json" \
            -d "{\"run_id\":\"${{ github.run_id }}\"}"
