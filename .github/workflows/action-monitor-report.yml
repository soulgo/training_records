name: Action Monitor Report

on:
  workflow_run:
    workflows:
      - Sync (Main)
      - Sync (Dev)
      - Deploy GitHub Pages
      - Deploy Cloudflare Pages (Dev)
      - Pending Replay (Dev)
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: action-monitor-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monitored branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report completed workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTION_TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_ACTION_TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITHUB_ACTION_MONITOR_ENVIRONMENT: ${{ github.event.workflow_run.head_branch }}
          GITHUB_ACTION_MONITOR_DB_URL: ${{ github.event.workflow_run.head_branch == 'dev' && secrets.DEV_TRAINING_DB_URL || secrets.TRAINING_DB_URL }}
          GITHUB_ACTION_MONITOR_DB_APP_NAME: ${{ github.event.workflow_run.head_branch == 'dev' && vars.DEV_TRAINING_DB_APP_NAME || vars.TRAINING_DB_APP_NAME }}
          GITHUB_ACTION_MONITOR_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
        run: node tools/report-github-action-status.mjs
