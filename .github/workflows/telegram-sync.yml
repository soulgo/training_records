name: Telegram Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 训练记录.md
  repository_dispatch:
    types:
      - telegram_update

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
      TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
      TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Sync archive and markdown to database
        if: github.event_name != 'repository_dispatch'
        run: npm run sync:db

      - name: Sync Telegram updates
        id: sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_CONCURRENCY: ${{ vars.AI_CONCURRENCY }}
          TRAINING_ANALYSIS_GOAL: ${{ vars.TRAINING_ANALYSIS_GOAL }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_POLL_LIMIT: ${{ vars.TELEGRAM_POLL_LIMIT }}
          TELEGRAM_SYNC_TRANSPORT: webhook
          TELEGRAM_SYNC_NOTIFY_STAGE: after_action
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
        run: npm run sync:telegram

      - name: Export markdown from database snapshot
        if: github.event_name != 'repository_dispatch'
        run: npm run export:markdown

      - name: Detect changes
        id: detect
        env:
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
        run: |
          if [ -z "$(git status --porcelain -- 训练记录.md source/_posts source/images)" ]; then
            echo "repo_changed=false" >> "$GITHUB_OUTPUT"
            echo "content_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "repo_changed=true" >> "$GITHUB_OUTPUT"
            echo "content_changed=true" >> "$GITHUB_OUTPUT"
          fi
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const resultPath = process.env.TELEGRAM_SYNC_RESULT_PATH;
          let readyStoredTrainingBatches = 0;
          try {
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            const batches = result.batchResults ?? result.batches ?? [];
            readyStoredTrainingBatches = batches.filter((batch) => {
              const kind = batch.kind ?? 'image';
              return kind === 'image' && batch.status === 'ready' && batch.persistenceStatus === 'stored';
            }).length;
          } catch {}
          console.log(`readyStoredTrainingBatches=${readyStoredTrainingBatches}`);
          if (readyStoredTrainingBatches > 0) {
            console.log('db_content_changed=true');
          } else {
            console.log('db_content_changed=false');
          }
          NODE

      - name: Run tests
        id: test
        if: github.event_name != 'repository_dispatch' && steps.detect.outputs.content_changed == 'true'
        run: npm run test:fast

      - name: Commit sync results
        id: commit
        if: steps.detect.outputs.repo_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 训练记录.md source/_posts source/images
          git commit -m "chore: sync Telegram updates"

      - name: Rebase on latest main
        id: rebase
        if: steps.detect.outputs.repo_changed == 'true'
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Push changes
        id: push
        if: steps.detect.outputs.repo_changed == 'true'
        run: git push origin HEAD:main

      - name: Build and deploy site snapshot
        id: site_build
        if: steps.detect.outputs.repo_changed == 'true' || steps.detect.outputs.db_content_changed == 'true'
        uses: ./.github/actions/site-build
        with:
          run_backfill: 'false'
          run_tests: 'false'
          deploy: 'true'

      - name: Notify Telegram sync success
        if: success() && github.event_name == 'repository_dispatch'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SYNC_NOTIFY: true
          TELEGRAM_SYNC_NOTIFY_STAGE: after_action
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
        run: node tools/telegram-sync-notify.mjs

      - name: Notify Telegram sync failure
        if: failure() && github.event_name == 'repository_dispatch'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STEP_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          STEP_SYNC_OUTCOME: ${{ steps.sync.outcome }}
          STEP_DETECT_OUTCOME: ${{ steps.detect.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
          STEP_COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          STEP_REBASE_OUTCOME: ${{ steps.rebase.outcome }}
          STEP_PUSH_OUTCOME: ${{ steps.push.outcome }}
          STEP_SITE_BUILD_OUTCOME: ${{ steps.site_build.outcome }}
        run: node tools/telegram-action-monitor.mjs
