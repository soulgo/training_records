name: Telegram Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 训练记录.md
  repository_dispatch:
    types:
      - telegram_update

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      repo_changed: ${{ steps.changes.outputs.repo_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill core from archive snapshot
        if: github.event_name != 'repository_dispatch'
        env:
          TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
          TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
          TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
          TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
        run: npm run backfill:core

      - name: Reconcile committed markdown back to core
        if: github.event_name != 'repository_dispatch'
        env:
          TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
          TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
          TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
          TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
        run: npm run reconcile:markdown

      - name: Sync Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_CONCURRENCY: ${{ vars.AI_CONCURRENCY }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_POLL_LIMIT: ${{ vars.TELEGRAM_POLL_LIMIT }}
          TELEGRAM_SYNC_TRANSPORT: webhook
          TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
          TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
          TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
          TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
        run: npm run sync:telegram

      - name: Export markdown from database snapshot
        if: github.event_name != 'repository_dispatch'
        env:
          TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
          TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
          TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
          TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
        run: npm run export:markdown

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- 训练记录.md source/_posts)" ]; then
            echo "repo_changed=false" >> "$GITHUB_OUTPUT"
            echo "content_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "repo_changed=true" >> "$GITHUB_OUTPUT"
            echo "content_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.changes.outputs.content_changed == 'true'
        run: npm test

      - name: Commit sync results
        if: steps.changes.outputs.repo_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 训练记录.md source/_posts
          git commit -m "chore: sync Telegram updates"

      - name: Rebase on latest main
        if: steps.changes.outputs.repo_changed == 'true'
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Push changes
        if: steps.changes.outputs.repo_changed == 'true'
        run: git push origin HEAD:main

  deploy:
    if: needs.sync.outputs.repo_changed == 'true'
    needs: sync
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site data and static files
        env:
          TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
          TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
          TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
          TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
          TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTIONS: "true"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
