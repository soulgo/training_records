name: Deploy Cloudflare Pages (Dev)

on:
  workflow_dispatch:
    inputs:
      strict_database_snapshot:
        description: Fail the build instead of falling back to Markdown when the database snapshot is unavailable.
        required: false
        default: 'false'
  push:
    branches:
      - dev
    paths:
      - 训练记录.md
      - _config.yml
      - source/**
      - src/**
      - themes/**
      - tools/**
      - prompts/**
      - .github/actions/site-build/action.yml
      - .github/workflows/deploy-cloudflare-pages-dev.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: 'true'
      TRAINING_DB_URL: ${{ secrets.DEV_TRAINING_DB_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.DEV_TRAINING_DB_APP_NAME }}
      TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
      TRAINING_SNAPSHOT_STRICT_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_database_snapshot || 'false' }}
      TRAINING_BUILD_ARCHIVE_WRITE: false
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build dev site
        uses: ./.github/actions/site-build
        with:
          run_backfill: 'true'
          sync_db_mode: 'auto'
          run_tests: 'true'
          deploy: 'false'

      - name: Remove production custom domain file
        shell: bash
        run: rm -f public/CNAME

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_PAGES_DEV_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_DEV_PROJECT_NAME || 'training-records-dev' }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Cloudflare Pages deploy failed::CLOUDFLARE_ACCOUNT_ID secret is required."
            exit 1
          fi

          token_names=()
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_names+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -n "${CLOUDFLARE_PAGES_API_TOKEN:-}" ] && [ "${CLOUDFLARE_PAGES_API_TOKEN}" != "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_names+=("CLOUDFLARE_PAGES_API_TOKEN")
          fi

          if [ "${#token_names[@]}" -eq 0 ]; then
            echo "::error title=Cloudflare Pages deploy failed::CLOUDFLARE_API_TOKEN or CLOUDFLARE_PAGES_API_TOKEN secret is required."
            exit 1
          fi

          last_status=1
          for token_name in "${token_names[@]}"; do
            token_value="${!token_name}"
            echo "Deploying Cloudflare Pages with ${token_name}."
            if CLOUDFLARE_API_TOKEN="${token_value}" npx --yes wrangler@3.114.14 --cwd public pages deploy . --project-name "${CLOUDFLARE_PAGES_DEV_PROJECT_NAME}" --branch dev; then
              echo "Cloudflare Pages deployed with ${token_name}."
              exit 0
            else
              last_status=$?
            fi
            echo "::notice title=Cloudflare Pages deploy retry::${token_name} failed; trying the next configured token if available."
          done

          echo "::error title=Cloudflare Pages deploy failed::All configured Cloudflare tokens failed. Check that at least one token has Pages edit access to the dev project."
          exit "${last_status}"
