name: Deploy Cloudflare Pages (Dev)

on:
  workflow_dispatch:
    inputs:
      strict_database_snapshot:
        description: Fail the build instead of falling back to Markdown when the database snapshot is unavailable.
        required: false
        default: 'true'
      target_thought_id:
        description: Optional thought id to verify on the deployed module page.
        required: false
        default: ''
      target_thought_module:
        description: Optional thought module key expected after a DB-only thought change.
        required: false
        default: ''
      target_thought_path:
        description: Optional deployed module page path to verify, such as /body-feedback/.
        required: false
        default: ''
      target_thought_expectation:
        description: Whether the target thought should be present or absent on the deployed module page.
        required: false
        default: 'present'
  push:
    branches:
      - dev
    paths:
      - 训练记录.md
      - _config.yml
      - source/**
      - src/**
      - themes/**
      - tools/**
      - prompts/**
      - .github/actions/site-build/action.yml
      - .github/workflows/deploy-cloudflare-pages-dev.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: 'true'
      TRAINING_DB_URL: ${{ secrets.DEV_TRAINING_DB_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.DEV_TRAINING_DB_APP_NAME }}
      TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
      TRAINING_SNAPSHOT_STRICT_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_database_snapshot || 'true' }}
      TRAINING_BUILD_ARCHIVE_WRITE: false
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build dev site
        uses: ./.github/actions/site-build
        with:
          run_backfill: 'true'
          sync_db_mode: 'auto'
          run_tests: 'true'
          deploy: 'false'

      - name: Remove production custom domain file
        shell: bash
        run: rm -f public/CNAME

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_PAGES_DEV_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_DEV_PROJECT_NAME || 'training-records-dev' }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Cloudflare Pages deploy failed::CLOUDFLARE_ACCOUNT_ID secret is required."
            exit 1
          fi

          token_names=()
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_names+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -n "${CLOUDFLARE_PAGES_API_TOKEN:-}" ] && [ "${CLOUDFLARE_PAGES_API_TOKEN}" != "${CLOUDFLARE_API_TOKEN:-}" ]; then
            token_names+=("CLOUDFLARE_PAGES_API_TOKEN")
          fi

          if [ "${#token_names[@]}" -eq 0 ]; then
            echo "::error title=Cloudflare Pages deploy failed::CLOUDFLARE_API_TOKEN or CLOUDFLARE_PAGES_API_TOKEN secret is required."
            exit 1
          fi

          last_status=1
          for token_name in "${token_names[@]}"; do
            token_value="${!token_name}"
            echo "Deploying Cloudflare Pages with ${token_name}."
            wrangler_out_file="$(mktemp)"
            if CLOUDFLARE_API_TOKEN="${token_value}" npx --yes wrangler@3.114.14 --cwd public pages deploy . --project-name "${CLOUDFLARE_PAGES_DEV_PROJECT_NAME}" --branch dev 2>&1 | tr -d '\r' | tee "${wrangler_out_file}"; then
              deploy_url="$(grep -oE 'https://[a-zA-Z0-9_-]+\.[a-zA-Z0-9_.-]+\.pages\.dev' "${wrangler_out_file}" | head -1 || true)"
              if [ -n "${deploy_url}" ]; then
                printf '%s' "${deploy_url}" > /tmp/cf_deploy_url.txt
                echo "Cloudflare Pages deployed at ${deploy_url} with ${token_name}."
              else
                echo "Cloudflare Pages deployed with ${token_name}."
              fi
              rm -f "${wrangler_out_file}"
              exit 0
            else
              last_status=$?
            fi
            echo "::notice title=Cloudflare Pages deploy retry::${token_name} failed; trying the next configured token if available."
          done

          echo "::error title=Cloudflare Pages deploy failed::All configured Cloudflare tokens failed. Check that at least one token has Pages edit access to the dev project."
          exit "${last_status}"

      - name: Verify deployed thought module page
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.target_thought_id != '' && inputs.target_thought_path != '' }}
        env:
          TARGET_THOUGHT_ID: ${{ inputs.target_thought_id }}
          TARGET_THOUGHT_MODULE: ${{ inputs.target_thought_module }}
          TARGET_THOUGHT_PATH: ${{ inputs.target_thought_path }}
          TARGET_THOUGHT_EXPECTATION: ${{ inputs.target_thought_expectation }}
          CLOUDFLARE_PAGES_DEV_BASE_URL: ${{ vars.CLOUDFLARE_PAGES_DEV_BASE_URL }}
        run: |
          prod_base_url="${CLOUDFLARE_PAGES_DEV_BASE_URL:-}"
          if [ -z "$prod_base_url" ]; then
            echo "::error title=Thought page verification skipped::CLOUDFLARE_PAGES_DEV_BASE_URL is required to verify dev thought pages."
            exit 1
          fi
          prod_base_url="${prod_base_url%/}"

          deploy_base_url=""
          if [ -f /tmp/cf_deploy_url.txt ]; then
            deploy_base_url="$(cat /tmp/cf_deploy_url.txt | tr -d '[:space:]')"
            deploy_base_url="${deploy_base_url%/}"
          fi
          if [ -n "$deploy_base_url" ]; then
            echo "Using deployment-specific URL for verification: ${deploy_base_url}"
          else
            echo "Deployment URL not available; falling back to production alias: ${prod_base_url}"
          fi

          verify_base_url="${deploy_base_url:-${prod_base_url}}"
          normalized_path="/${TARGET_THOUGHT_PATH#/}"
          normalized_path="${normalized_path%/}/"
          target_url="${verify_base_url}${normalized_path}"
          page_file="$(mktemp)"
          module_paths=("/thoughts/" "/misc/" "/body-feedback/")
          expected="${TARGET_THOUGHT_EXPECTATION:-present}"
          if [ "$expected" != "absent" ]; then
            expected="present"
          fi

          if ! curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -H "Cache-Control: no-cache" "$target_url" -o "$page_file"; then
            echo "::error title=Thought page verification failed::Could not fetch ${target_url} after deploy."
            exit 1
          fi

          found=false
          if grep -F "data-thought-id=\"${TARGET_THOUGHT_ID}\"" "$page_file" >/dev/null; then
            found=true
          fi

          if [ "$found" = "false" ] && [ -n "$deploy_base_url" ] && [ "$deploy_base_url" != "$prod_base_url" ]; then
            echo "Thought #${TARGET_THOUGHT_ID} not found on deployment URL; waiting 20s for CDN propagation and retrying..."
            sleep 20
            rm -f "$page_file"
            page_file="$(mktemp)"
            if curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -H "Cache-Control: no-cache" "$target_url" -o "$page_file"; then
              if grep -F "data-thought-id=\"${TARGET_THOUGHT_ID}\"" "$page_file" >/dev/null; then
                found=true
              fi
            fi
          fi

          if { [ "$expected" = "present" ] && [ "$found" = "true" ]; } ||
             { [ "$expected" = "absent" ] && [ "$found" = "false" ]; }; then
            for module_path in "${module_paths[@]}"; do
              module_url="${verify_base_url}${module_path}"
              module_file="$(mktemp)"
              if ! curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -H "Cache-Control: no-cache" "$module_url" -o "$module_file"; then
                echo "::error title=Thought page verification failed::Could not fetch ${module_url} after deploy."
                exit 1
              fi

              module_found=false
              if grep -F "data-thought-id=\"${TARGET_THOUGHT_ID}\"" "$module_file" >/dev/null; then
                module_found=true
              fi

              if [ "$expected" = "present" ] && [ "$module_path" != "$normalized_path" ] && [ "$module_found" = "true" ]; then
                echo "::error title=Thought page verification failed::Unexpected thought #${TARGET_THOUGHT_ID} on ${module_url}; expected it only on ${target_url}."
                exit 1
              fi

              if [ "$expected" = "absent" ] && [ "$module_found" = "true" ]; then
                echo "::error title=Thought page verification failed::Unexpected thought #${TARGET_THOUGHT_ID} on ${module_url}; expected it absent from all thought module pages."
                exit 1
              fi
            done

            if [ -n "$deploy_base_url" ] && [ "$deploy_base_url" != "$prod_base_url" ]; then
              echo "Deployment URL verification passed. Waiting 15s for CDN propagation to production alias..."
              sleep 15
              prod_target_url="${prod_base_url}${normalized_path}"
              prod_page_file="$(mktemp)"
              if curl -fsSL --retry 10 --retry-delay 10 --retry-all-errors -H "Cache-Control: no-cache" "$prod_target_url" -o "$prod_page_file"; then
                prod_found=false
                if grep -F "data-thought-id=\"${TARGET_THOUGHT_ID}\"" "$prod_page_file" >/dev/null; then
                  prod_found=true
                fi
                if [ "$prod_found" = "true" ]; then
                  echo "Production alias ${prod_target_url} is now serving the updated content."
                else
                  echo "::warning title=CDN propagation pending::Production alias ${prod_target_url} has not yet updated; deployment URL verified successfully. Content should propagate shortly."
                fi
              else
                echo "::warning title=CDN propagation pending::Could not fetch production alias ${prod_target_url}; deployment URL verified successfully."
              fi
            fi

            exit 0
          fi

          echo "::error title=Thought page verification failed::Thought #${TARGET_THOUGHT_ID} expected ${expected} on ${target_url}, found=${found}."
          exit 1
