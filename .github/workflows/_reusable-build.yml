name: Reusable Build & Deploy

on:
  workflow_call:
    inputs:
      run_backfill:
        type: boolean
        default: true
      run_tests:
        type: boolean
        default: true
      deploy:
        type: boolean
        default: true
      checkout_ref:
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
      TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Hexo
        uses: actions/cache@v4
        with:
          path: |
            .hexo_cache
          key: hexo-${{ runner.os }}-${{ hashFiles('训练记录.md', 'source/_posts/**', 'themes/**') }}

      - name: Install dependencies
        run: npm ci

      - name: Backfill core from archive snapshot
        if: ${{ inputs.run_backfill }}
        run: npm run backfill:core

      - name: Reconcile committed markdown back to core
        if: ${{ inputs.run_backfill }}
        run: npm run reconcile:markdown

      - name: Backfill thought markdown back to core
        if: ${{ inputs.run_backfill }}
        run: npm run backfill:thoughts

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: npm test

      - name: Build site data and static files
        env:
          TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTIONS: "true"
        run: npm run build

      - name: Setup Pages
        if: ${{ inputs.deploy }}
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        if: ${{ inputs.deploy }}
        id: deployment
        uses: actions/deploy-pages@v4
