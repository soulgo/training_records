name: Sync (Main)
run-name: ${{ github.event.inputs.queue_task_id && format('Sync queue task {0}', github.event.inputs.queue_task_id) || github.event.action || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      dispatch_payload:
        description: Serialized webhook payload from the Cloudflare sync queue
        required: false
        default: ''
      queue_task_id:
        description: Sync queue task id used to correlate workflow runs
        required: false
        default: ''
      channel:
        description: Main sync channel to run
        required: true
        type: choice
        default: telegram
        options:
          - telegram
          - feishu
  push:
    branches:
      - main
    paths:
      - 训练记录.md
  repository_dispatch:
    types:
      - telegram_update
      - feishu_update

# This job both commits generated artifacts and dispatches the deploy workflow.
# Keep write scopes here until sync/deploy are split into separate jobs.
permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ (github.event.inputs.queue_task_id || github.event_name == 'repository_dispatch') && format('sync-{0}', github.run_id) || 'sync' }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TRAINING_DB_ENABLED: ${{ vars.TRAINING_DB_ENABLED }}
      TRAINING_DB_URL: ${{ secrets.TRAINING_DB_URL }}
      TRAINING_DB_READONLY_URL: ${{ secrets.TRAINING_DB_READONLY_URL }}
      TRAINING_DB_TIMEOUT_MS: ${{ vars.TRAINING_DB_TIMEOUT_MS }}
      TRAINING_DB_APP_NAME: ${{ vars.TRAINING_DB_APP_NAME }}
      TRAINING_SNAPSHOT_SOURCE: ${{ vars.TRAINING_SNAPSHOT_SOURCE }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Determine sync channel
        id: channel
        run: |
          EVENT_TYPE="${{ github.event.action }}"
          INPUT_CHANNEL="${{ github.event.inputs.channel || 'telegram' }}"
          IS_WEBHOOK_DISPATCH=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ORIGINAL_GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH"
            GITHUB_EVENT_PATH="$RUNNER_TEMP/queued-dispatch-event.json"
            export ORIGINAL_GITHUB_EVENT_PATH GITHUB_EVENT_PATH
            EVENT_TYPE="$(node <<'NODE'
          const fs = require('fs');
          const workflowEvent = JSON.parse(fs.readFileSync(process.env.ORIGINAL_GITHUB_EVENT_PATH, 'utf8'));
          const dispatchPayloadRaw = workflowEvent.inputs?.dispatch_payload ?? '';
          if (!dispatchPayloadRaw) {
            process.exit(0);
          }
          const payload = JSON.parse(dispatchPayloadRaw);
          const event = {
            action: payload.action || '',
            client_payload: payload.client_payload ?? payload,
            notification: payload.notification ?? null,
          };
          fs.writeFileSync(process.env.GITHUB_EVENT_PATH, JSON.stringify(event));
          process.stdout.write(event.action || '');
          NODE
          )"
            if [ -s "$GITHUB_EVENT_PATH" ]; then
              IS_WEBHOOK_DISPATCH=true
              echo "SYNC_DISPATCH_EVENT_PATH=$GITHUB_EVENT_PATH" >> "$GITHUB_ENV"
            else
              GITHUB_EVENT_PATH="$ORIGINAL_GITHUB_EVENT_PATH"
              export GITHUB_EVENT_PATH
            fi
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            IS_WEBHOOK_DISPATCH=true
          fi
          echo "is_webhook_dispatch=${IS_WEBHOOK_DISPATCH}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_TYPE" = "feishu_update" ] || [ "$INPUT_CHANNEL" = "feishu" ]; then
            echo "channel=feishu" >> "$GITHUB_OUTPUT"
            echo "sync_command=sync:feishu" >> "$GITHUB_OUTPUT"
            echo "result_path=${RUNNER_TEMP}/feishu-sync-result.json" >> "$GITHUB_OUTPUT"
            echo "commit_message=chore: sync Feishu updates" >> "$GITHUB_OUTPUT"
          else
            echo "channel=telegram" >> "$GITHUB_OUTPUT"
            echo "sync_command=sync:telegram" >> "$GITHUB_OUTPUT"
            echo "result_path=${RUNNER_TEMP}/telegram-sync-result.json" >> "$GITHUB_OUTPUT"
            echo "commit_message=chore: sync Telegram updates" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync safe database repairs
        if: steps.channel.outputs.is_webhook_dispatch != 'true' && steps.channel.outputs.channel == 'telegram'
        run: npm run sync:db

      - name: Sync updates
        id: sync
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai-compatible' }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
          AI_CONCURRENCY: ${{ vars.AI_CONCURRENCY }}
          TELEGRAM_RECOGNITION_IMAGE_INPUT_MODE: inline
          AI_IMAGE_PROCESSING_ENABLED: "true"
          AI_OCR_ENABLED: ${{ vars.AI_OCR_ENABLED }}
          AI_OCR_FAILURE_MODE: ${{ vars.AI_OCR_FAILURE_MODE }}
          TELEGRAM_RECOGNITION_MODEL: ${{ vars.TELEGRAM_RECOGNITION_MODEL }}
          TELEGRAM_RECOGNITION_FALLBACK_API_KEY: ${{ secrets.TELEGRAM_RECOGNITION_FALLBACK_API_KEY }}
          TELEGRAM_RECOGNITION_FALLBACK_BASE_URL: ${{ secrets.TELEGRAM_RECOGNITION_FALLBACK_BASE_URL }}
          TELEGRAM_RECOGNITION_FALLBACK_MODEL: ${{ vars.TELEGRAM_RECOGNITION_FALLBACK_MODEL }}
          TELEGRAM_RECOGNITION_FALLBACK_TIMEOUT_MS: ${{ vars.TELEGRAM_RECOGNITION_FALLBACK_TIMEOUT_MS }}
          TELEGRAM_RECOGNITION_CACHE_ENABLED: ${{ vars.TELEGRAM_RECOGNITION_CACHE_ENABLED }}
          TRAINING_ANALYSIS_GOAL: ${{ vars.TRAINING_ANALYSIS_GOAL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_POLL_LIMIT: ${{ vars.TELEGRAM_POLL_LIMIT }}
          TELEGRAM_SYNC_TRANSPORT: webhook
          TELEGRAM_SYNC_NOTIFY_STAGE: after_action
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ALLOWED_CHAT_IDS: ${{ secrets.FEISHU_ALLOWED_CHAT_IDS }}
          FEISHU_RECOGNITION_IMAGE_INPUT_MODE: inline
          FEISHU_SYNC_TRANSPORT: webhook
          FEISHU_SYNC_NOTIFY_STAGE: after_action
          FEISHU_SYNC_RESULT_PATH: ${{ runner.temp }}/feishu-sync-result.json
          COS_ENABLED: ${{ vars.COS_ENABLED }}
          COS_PROVIDER: ${{ vars.COS_PROVIDER || 'tencent_cos' }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_DOMAIN: ${{ secrets.COS_DOMAIN }}
          COS_PATH_PREFIX: ${{ secrets.COS_PATH_PREFIX }}
          SYNC_FAILURE_SUMMARY_PATH: ${{ runner.temp }}/sync-failure-summary.txt
        run: |
          log_path="${RUNNER_TEMP}/sync-command.log"
          rm -f "$SYNC_FAILURE_SUMMARY_PATH" "$log_path"
          summarizeFailure() {
            grep -E "COS|PutObject|HeadObject|Error:|failed|AccessDenied|RequestId|statusCode" "$log_path" \
              | tail -n 8 \
              | sed -E 's/\x1b\[[0-9;]*m//g' \
              > "$SYNC_FAILURE_SUMMARY_PATH" || true
            if [ ! -s "$SYNC_FAILURE_SUMMARY_PATH" ]; then
              tail -n 8 "$log_path" > "$SYNC_FAILURE_SUMMARY_PATH" || true
            fi
          }
          CHANNEL="${{ steps.channel.outputs.channel }}"
          if [ "$CHANNEL" = "feishu" ] && [ -z "${TRAINING_DB_APP_NAME:-}" ]; then
            export TRAINING_DB_APP_NAME=sync-main-feishu
          fi
          set +e
          npm run ${{ steps.channel.outputs.sync_command }} 2>&1 | tee "$log_path"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summarizeFailure
            exit "$status"
          fi

      - name: Detect changes
        id: detect
        env:
          SYNC_RESULT_PATH: ${{ steps.channel.outputs.result_path }}
        run: |
          if [ -z "$(git status --porcelain -- 训练记录.md source/_posts source/images)" ]; then
            echo "repo_changed=false" >> "$GITHUB_OUTPUT"
            echo "content_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "repo_changed=true" >> "$GITHUB_OUTPUT"
            echo "content_changed=true" >> "$GITHUB_OUTPUT"
          fi
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const resultPath = process.env.SYNC_RESULT_PATH;
          let readyStoredContentBatches = 0;
          let thoughtCheck = null;
          try {
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            const batches = result.batches ?? [];
            readyStoredContentBatches = batches.filter((batch) => {
              const kind = batch.kind ?? 'image';
              return ['image', 'thought', 'thought_edit', 'thought_delete', 'thought_move'].includes(kind) &&
                batch.status === 'ready' &&
                batch.persistenceStatus === 'stored';
            }).length;
            thoughtCheck = batches.map(resolveThoughtCheck).find(Boolean) ?? null;
          } catch {}
          console.log(`readyStoredContentBatches=${readyStoredContentBatches}`);
          if (readyStoredContentBatches > 0) {
            console.log('db_content_changed=true');
          } else {
            console.log('db_content_changed=false');
          }
          console.log(`thought_check_id=${thoughtCheck?.id ?? ''}`);
          console.log(`thought_check_module=${thoughtCheck?.module ?? ''}`);
          console.log(`thought_check_path=${thoughtCheck?.path ?? ''}`);
          console.log(`thought_check_expectation=${thoughtCheck?.expectation ?? ''}`);

          function resolveThoughtCheck(batch) {
            if (batch?.status !== 'ready' || batch?.persistenceStatus !== 'stored') {
              return null;
            }

            const kind = batch.kind ?? 'image';
            const payload = kind === 'thought'
              ? batch.thought
              : kind === 'thought_edit'
                ? batch.thoughtEdit
                : kind === 'thought_move'
                  ? batch.thoughtMove
                  : kind === 'thought_delete'
                    ? batch.thoughtDelete
                    : null;
            if (!payload) {
              return null;
            }

            const id = payload.targetMessageId ?? payload.telegramMessageId ?? null;
            const module = normalizeThoughtModule(payload.thoughtModule) ??
              normalizeThoughtModule(batch.persistedThoughtModule);
            const path = {
              workout: '/thoughts/',
              misc: '/misc/',
              body_feedback: '/body-feedback/',
            }[module] ?? null;
            const expectation = kind === 'thought_delete' ? 'absent' : 'present';
            return id && module && path ? { id, module, path, expectation } : null;
          }

          function normalizeThoughtModule(value) {
            return ['workout', 'misc', 'body_feedback'].includes(value) ? value : null;
          }
          NODE

      - name: Run tests
        id: test
        if: steps.channel.outputs.is_webhook_dispatch != 'true' && steps.channel.outputs.channel == 'telegram' && steps.detect.outputs.content_changed == 'true'
        run: npm run test:fast

      - name: Commit sync results
        id: commit
        if: steps.detect.outputs.repo_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 训练记录.md source/_posts source/images
          git commit -m "${{ steps.channel.outputs.commit_message }}"

      - name: Rebase on latest main
        id: rebase
        if: steps.detect.outputs.repo_changed == 'true'
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Push changes
        id: push
        if: steps.detect.outputs.repo_changed == 'true'
        run: git push origin HEAD:main

      - name: Write Telegram sync summary
        if: always() && steps.channel.outputs.is_webhook_dispatch == 'true' && steps.channel.outputs.channel == 'telegram'
        env:
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
          QUEUE_TASK_ID: ${{ github.event.inputs.queue_task_id }}
        run: |
          TRACE_SEED="${QUEUE_TASK_ID:-${GITHUB_RUN_ID}}"
          TRACE_ID="$(TRACE_SEED="$TRACE_SEED" node -e "const { createHash } = require('node:crypto'); const seed = process.env.TRACE_SEED || ''; process.stdout.write(seed ? 'tr_' + createHash('sha256').update(seed).digest('hex').slice(0, 16) : '');")"
          node tools/action-sync-summary.mjs \
            --channel telegram \
            --result-path "$TELEGRAM_SYNC_RESULT_PATH" \
            --trace-id "$TRACE_ID" \
            --queue-task-id "$QUEUE_TASK_ID" \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Write Feishu sync summary
        if: always() && steps.channel.outputs.is_webhook_dispatch == 'true' && steps.channel.outputs.channel == 'feishu'
        env:
          FEISHU_SYNC_RESULT_PATH: ${{ runner.temp }}/feishu-sync-result.json
          QUEUE_TASK_ID: ${{ github.event.inputs.queue_task_id }}
        run: |
          TRACE_SEED="${QUEUE_TASK_ID:-${GITHUB_RUN_ID}}"
          TRACE_ID="$(TRACE_SEED="$TRACE_SEED" node -e "const { createHash } = require('node:crypto'); const seed = process.env.TRACE_SEED || ''; process.stdout.write(seed ? 'tr_' + createHash('sha256').update(seed).digest('hex').slice(0, 16) : '');")"
          node tools/action-sync-summary.mjs \
            --channel feishu \
            --result-path "$FEISHU_SYNC_RESULT_PATH" \
            --trace-id "$TRACE_ID" \
            --queue-task-id "$QUEUE_TASK_ID" \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram sync result
        if: success() && steps.channel.outputs.is_webhook_dispatch == 'true' && steps.channel.outputs.channel == 'telegram'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SYNC_NOTIFY: true
          TELEGRAM_SYNC_NOTIFY_STAGE: after_action
          TELEGRAM_SYNC_RESULT_PATH: ${{ runner.temp }}/telegram-sync-result.json
        run: node tools/telegram-sync-notify.mjs

      - name: Notify Feishu sync result
        if: success() && steps.channel.outputs.is_webhook_dispatch == 'true' && steps.channel.outputs.channel == 'feishu'
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SYNC_NOTIFY: true
          FEISHU_SYNC_NOTIFY_STAGE: after_action
          FEISHU_SYNC_RESULT_PATH: ${{ runner.temp }}/feishu-sync-result.json
        run: node tools/feishu-sync-notify.mjs

      - name: Dispatch site deploy
        id: deploy
        if: success() && steps.channel.outputs.is_webhook_dispatch == 'true' && (steps.detect.outputs.repo_changed == 'true' || steps.detect.outputs.db_content_changed == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_DEPLOY_WORKFLOW_FILE: deploy-pages.yml
          SITE_DEPLOY_REF: main
          QUEUE_TASK_ID: ${{ github.event.inputs.queue_task_id }}
          SOURCE_CHANNEL: ${{ steps.channel.outputs.channel }}
          THOUGHT_CHECK_ID: ${{ steps.detect.outputs.thought_check_id }}
          THOUGHT_CHECK_MODULE: ${{ steps.detect.outputs.thought_check_module }}
          THOUGHT_CHECK_PATH: ${{ steps.detect.outputs.thought_check_path }}
          THOUGHT_CHECK_EXPECTATION: ${{ steps.detect.outputs.thought_check_expectation }}
        run: node tools/dispatch-site-deploy.mjs

      - name: Notify Telegram sync failure
        if: failure() && steps.channel.outputs.is_webhook_dispatch == 'true' && steps.channel.outputs.channel == 'telegram'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STEP_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          STEP_SYNC_OUTCOME: ${{ steps.sync.outcome }}
          STEP_DETECT_OUTCOME: ${{ steps.detect.outcome }}
          STEP_TEST_OUTCOME: ${{ steps.test.outcome }}
          STEP_COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          STEP_REBASE_OUTCOME: ${{ steps.rebase.outcome }}
          STEP_PUSH_OUTCOME: ${{ steps.push.outcome }}
          STEP_DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SYNC_FAILURE_SUMMARY_PATH: ${{ runner.temp }}/sync-failure-summary.txt
        run: node tools/telegram-action-monitor.mjs

      - name: Notify Feishu sync failure
        if: failure() && steps.channel.outputs.is_webhook_dispatch == 'true' && steps.channel.outputs.channel == 'feishu'
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          STEP_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          STEP_SYNC_OUTCOME: ${{ steps.sync.outcome }}
          STEP_DETECT_OUTCOME: ${{ steps.detect.outcome }}
          STEP_COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          STEP_REBASE_OUTCOME: ${{ steps.rebase.outcome }}
          STEP_PUSH_OUTCOME: ${{ steps.push.outcome }}
          STEP_DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: node tools/feishu-action-monitor.mjs
