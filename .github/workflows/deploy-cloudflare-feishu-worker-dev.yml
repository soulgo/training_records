name: Deploy Cloudflare Feishu Worker (Dev)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-feishu-worker-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Dev Feishu worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.feishu-dev.toml
