name: Shared Site Build
description: Shared setup, build, and deploy steps for the Hexo site

inputs:
  run_backfill:
    description: Whether to run safe database repairs before building
    required: false
    default: 'true'
  sync_db_mode:
    description: 'Database sync strategy: auto, always, or never'
    required: false
    default: 'auto'
  run_tests:
    description: Whether to run the full test suite before building
    required: false
    default: 'true'
  deploy:
    description: Whether to upload and deploy the generated Pages artifact
    required: false
    default: 'true'
  install_dependencies:
    description: Whether to run npm ci before building
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Cache Hexo
      uses: actions/cache@v4
      with:
        path: |
          db.json
        key: hexo-${{ runner.os }}-${{ hashFiles('package-lock.json', '_config.yml', 'source/**', 'themes/**') }}

    - name: Install dependencies
      if: ${{ inputs.install_dependencies == 'true' }}
      shell: bash
      run: npm ci

    - name: Detect safe database sync input changes
      id: sync_db_changes
      shell: bash
      env:
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        mode="${{ inputs.sync_db_mode }}"
        if [ "${{ inputs.run_backfill }}" != "true" ]; then
          echo "sync_db_needed=false" >> "$GITHUB_OUTPUT"
          echo "sync_db_reason=disabled" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$mode" = "always" ]; then
          echo "sync_db_needed=true" >> "$GITHUB_OUTPUT"
          echo "sync_db_reason=forced" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$mode" = "never" ]; then
          echo "sync_db_needed=false" >> "$GITHUB_OUTPUT"
          echo "sync_db_reason=disabled_by_mode" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        base=""
        if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$GITHUB_EVENT_BEFORE" ] && ! echo "$GITHUB_EVENT_BEFORE" | grep -Eq '^0+$'; then
          base="$GITHUB_EVENT_BEFORE"
        elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
          base="HEAD^"
        fi

        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" >/dev/null 2>&1; then
          echo "sync_db_needed=true" >> "$GITHUB_OUTPUT"
          echo "sync_db_reason=unknown_base" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        changed="$(git diff --name-only "$base" HEAD -- \
          '训练记录.md' \
          'source/_posts/**' \
          'source/images/**' \
          'sql/**' \
          'src/db/training/**' \
          'tools/sync-training-core.mjs' \
          'tools/backfill-training-core-from-archive.mjs' \
          'tools/backfill-thoughts-to-core.mjs' \
          'tools/reconcile-training-markdown-to-core.mjs' \
          'tools/import-training-markdown.mjs' \
          'tools/export-training-markdown.mjs' \
          'package.json' \
          'package-lock.json')"

        if [ -z "$changed" ]; then
          echo "sync_db_needed=false" >> "$GITHUB_OUTPUT"
          echo "sync_db_reason=no_data_changes" >> "$GITHUB_OUTPUT"
        else
          echo "sync_db_needed=true" >> "$GITHUB_OUTPUT"
          echo "sync_db_reason=data_changes" >> "$GITHUB_OUTPUT"
        fi

    - name: Sync safe database repairs
      if: ${{ inputs.run_backfill == 'true' && (inputs.sync_db_mode == 'always' || steps.sync_db_changes.outputs.sync_db_needed == 'true') }}
      shell: bash
      run: npm run sync:db

    - name: Export database markdown for Hexo posts
      shell: bash
      env:
        SNAPSHOT_SOURCE: ${{ env.TRAINING_SNAPSHOT_SOURCE }}
        STRICT_DATABASE_SNAPSHOT: ${{ env.TRAINING_SNAPSHOT_STRICT_DATABASE }}
      run: |
        snapshot_source="$(printf '%s' "$SNAPSHOT_SOURCE" | tr '[:upper:]' '[:lower:]')"
        strict_database_snapshot="$(printf '%s' "$STRICT_DATABASE_SNAPSHOT" | tr '[:upper:]' '[:lower:]')"
        if [ "$snapshot_source" != "database" ] || [ "$strict_database_snapshot" != "true" ]; then
          echo "Skipping database markdown export for snapshot_source=${SNAPSHOT_SOURCE:-unset}, strict_database_snapshot=${STRICT_DATABASE_SNAPSHOT:-unset}"
          exit 0
        fi
        npm run export:markdown
        echo "TRAINING_SNAPSHOT_SOURCE=markdown" >> "$GITHUB_ENV"
        echo "TRAINING_SNAPSHOT_STRICT_DATABASE=false" >> "$GITHUB_ENV"

    - name: Run tests
      if: ${{ inputs.run_tests == 'true' }}
      shell: bash
      run: npm run test:fast

    - name: Build site data and static files
      shell: bash
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_ACTIONS: 'true'
      run: npm run build

    - name: Verify generated site artifact
      shell: bash
      run: test -s public/index.html

    - name: Setup Pages
      if: ${{ inputs.deploy == 'true' }}
      uses: actions/configure-pages@v5

    - name: Upload artifact
      if: ${{ inputs.deploy == 'true' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public

    - name: Deploy to GitHub Pages
      if: ${{ inputs.deploy == 'true' }}
      uses: actions/deploy-pages@v4
